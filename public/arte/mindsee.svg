<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><style>
text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8px}
.sweep{transform-box:view-box;transform-origin:160px 90px;animation:spin 5s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.d2{animation-delay:.8s}.d3{animation-delay:1.6s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.sweep,.ping{animation:none}}
</style><defs><linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A1B6B"/><stop offset="1" stop-color="#0B6F6A"/></linearGradient></defs><rect width="320" height="180" fill="url(#bgm)"/>
